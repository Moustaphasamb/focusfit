name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests et lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installation
        run: npm ci

      - name: Suite de tests
        run: npm test

      - name: Analyse statique
        run: npm run lint

      - name: Vérification de la syntaxe des scripts
        run: npm run lint:syntax
